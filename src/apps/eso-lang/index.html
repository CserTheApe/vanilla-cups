<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Eso-Lang</title>
        <link href="../../main.css" type="text/css" rel="stylesheet" />
        <link href="style.css" type="text/css" rel="stylesheet" />
        <link href="../../lib/modal/style.css" type="text/css" rel="stylesheet" />
    </head>
    <body>
        <header></header>
        <main>
            <h1>Eso-Lang</h1>
            <div id="app-container">
                <div class="app-section">
                    <div id="app-input-section" style="display:flex; flex-direction: column; gap: 10px;">
                        <div>
                            <span>Language:</span>
                            <select id="lang-select"></select>
                        </div>
                        <div>
                            Code: <br />
                            <textarea id="code-text"></textarea>
                            <div id="code-overlay"></div>
                            <span style="font-size: small; font-weight: 600;">Use "<span id="breakpoint-text">#</span>" for breakpoints</span>
                        </div>
                        <div>
                            Input: <br />
                            <textarea id="input-text"></textarea>
                        </div>
                        <div>
                            Memory: <input type="number" min="10" max="30000" id="mem-size" />
                        </div>
                    </div>
                    <button id="execute">Execute</button>
                    <div>
                        Output: <br />
                        <textarea id="output-text"></textarea>
                    </div>
                </div>
                <div class="app-section">
                    <div style="display:flex; justify-content: space-between;">
                        <button id="dbuggr">Debug Code</button>
                        <div id="dbug-options" style="display: none;">
                            <button id="dbug-step">Step</button>
                            <button id="dbug-run">Run</button>
                            <button id="dbug-stop">Stop</button>
                        </div>
                        <button id="utf-button">UTF-16 Table</button>
                    </div>
                    <canvas id="canvas" width="900" height="600"></canvas>
                </div>
            </div>
        </main>
        <footer></footer>
        
        <script src="../../main.js"></script>
        <script src="../../lib/modal/script.js"></script>
        <script src="script.js" type="module"></script>
    </body>
</html>
